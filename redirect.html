<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0f1a" />
  <title>ACESSO VIP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0f0f1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
    }
    .wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .logo { width: 88px; height: 88px; border-radius: 20px;
      box-shadow: 0 0 36px rgba(124,58,237,0.55);
      animation: pop-in 0.4s ease-out both; }
    @keyframes pop-in {
      from { transform: scale(0.8); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .title { font-size: 22px; font-weight: 900; }
    .sub { font-size: 13px; color: rgba(255,255,255,0.45); margin-top: -10px; }
    .dot-wrap { display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: rgba(255,255,255,0.4); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #7C3AED;
      animation: blink 1s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }
    /* Botão fallback — só aparece se automático falhar */
    .btn-fallback {
      display: none;
      padding: 15px 32px;
      background: linear-gradient(135deg, #1a73e8, #0d62d0);
      color: #fff; font-size: 16px; font-weight: 900;
      border: none; border-radius: 50px; cursor: pointer;
      box-shadow: 0 4px 24px rgba(26,115,232,0.5);
      letter-spacing: 0.5px;
      animation: fade-in 0.3s ease-out both;
    }
    @keyframes fade-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo"
      src="https://acessoplatafomas.com.br/icons/icon-192.png"
      alt="ACESSO VIP"
      onerror="this.style.display='none'" />
    <div class="title">ACESSO VIP</div>
    <div class="sub">Plataformas exclusivas com bônus</div>
    <div class="dot-wrap">
      <div class="dot"></div>
      <span id="msg">Abrindo...</span>
    </div>
    <button class="btn-fallback" id="btnFallback" onclick="tryChrome()">
      Abrir no Chrome →
    </button>
  </div>

  <script>
  (function(){
    var TARGET = 'https://acessoplatafomas.com.br';
    var ua = navigator.userAgent || '';
    var isAndroid = /Android/i.test(ua);
    var isIOS     = /iPhone|iPad|iPod/i.test(ua);
    var isInWebView = /Instagram|FBAN|FBAV|TikTok|musical_ly/i.test(ua);

    // Constrói a URL intent:// que dispara o diálogo nativo do Android
    // "Deseja abrir com Chrome?" — 1 toque, sem página intermediária
    function intentUrl(pkg) {
      return 'intent://' + TARGET.replace(/^https?:\/\//, '') +
        '#Intent;scheme=https;package=' + pkg + ';end';
    }

    function tryChrome() {
      if (isAndroid) {
        // 1ª tentativa: Chrome direto (dispara diálogo nativo do Android)
        window.location.href = intentUrl('com.android.chrome');

        // 2ª tentativa (400ms): navegador padrão do Android
        setTimeout(function(){
          window.location.href = intentUrl('com.google.android.browser');
        }, 400);

        // 3ª tentativa (900ms): qualquer navegador via VIEW action
        setTimeout(function(){
          window.location.href =
            'intent://' + TARGET.replace(/^https?:\/\//, '') +
            '#Intent;scheme=https;action=android.intent.action.VIEW;' +
            'category=android.intent.category.BROWSABLE;end';
        }, 900);

        // 4ª tentativa (1.5s): _blank trick
        setTimeout(function(){
          var a = document.createElement('a');
          a.href = TARGET; a.target = '_blank'; a.rel = 'noopener';
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }, 1500);

      } else if (isIOS) {
        try { window.location.href = 'x-safari-' + TARGET; } catch(e){}
        setTimeout(function(){ window.location.replace(TARGET); }, 500);
      } else {
        window.location.replace(TARGET);
      }
    }

    if (isInWebView) {
      // Disparar imediatamente — sem nenhuma tela intermediária
      tryChrome();

      // Se após 2.5s ainda estiver aqui, mostrar botão de 1 toque
      setTimeout(function(){
        document.getElementById('msg').textContent = 'Toque para continuar';
        document.getElementById('btnFallback').style.display = 'block';
      }, 2500);

    } else {
      // Já está no Chrome/Safari — redirecionar direto
      window.location.replace(TARGET);
    }
  })();
  </script>
</body>
</html>
